<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stories</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="app">
    <header class="app-header">
      <h1 class="app-title">Stories</h1>
    </header>

    <section class="stories-section" aria-label="Your stories">
      <div id="story-tray" class="story-tray">
        <button type="button" id="add-story-btn" class="story-add-btn" aria-label="Add story">
          <span class="add-icon">+</span>
        </button>
      </div>
      <input type="file" id="file-input" class="visually-hidden" accept="image/*">
    </section>

    <div class="upload-panel">
      <label for="story-duration">Story duration (seconds)</label>
      <input type="number" id="story-duration" min="15" max="60" value="15" step="1">
      <p class="upload-hint">Default 15s. Increase up to 60s before you upload.</p>
      <p id="upload-error" class="upload-error" hidden></p>
    </div>
  </main>

  <div id="viewer" class="viewer" hidden aria-modal="true" role="dialog" aria-label="Story viewer">
    <div id="viewer-backdrop" class="viewer-backdrop">
      <div id="viewer-frame" class="viewer-frame">
        <div id="progress-segments" class="progress-segments" aria-hidden="true"></div>

        <button type="button" id="viewer-close" class="viewer-close" aria-label="Close story">&times;</button>

        <div class="viewer-media">
          <img id="viewer-image" class="viewer-image" src="" alt="Story">
        </div>

        <div class="viewer-footer">
          <div class="viewer-actions">
            <button type="button" id="like-btn" class="like-btn" aria-label="Like story">
              <span class="heart" aria-hidden="true">&#9829;</span>
            </button>
            <span id="like-count" class="like-count">0</span>
          </div>

          <div class="comments-block">
            <p id="comment-empty" class="comment-empty">No comments yet</p>
            <ul id="comments-list" class="comments-list"></ul>
            <form id="comment-form" class="comment-form">
              <input type="text" id="comment-input" class="comment-input" placeholder="Add a comment…"
                maxlength="250" autocomplete="off">
              <button type="submit" class="comment-submit">Post</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
